spring.application.name=trasactions

# Virtual Threads (Project Loom — Java 21)
# Cada requisicao roda em uma virtual thread levissima.
# Quando bloqueia no banco, a thread do SO e liberada para outras tarefas.
spring.threads.virtual.enabled=true

# Banco H2 em memoria (padrao local e testes)
spring.datasource.url=jdbc:h2:mem:trasactionsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HikariCP — pool local (H2, uso em desenvolvimento)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------
# Springdoc / Swagger UI
# -------------------------------------------------------
# JSON da spec OpenAPI:  http://localhost:8080/v3/api-docs
# YAML da spec OpenAPI:  http://localhost:8080/v3/api-docs.yaml
# Interface visual:      http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.pismo.trasactions.api

